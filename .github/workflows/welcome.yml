name: Post welcome comment on PR
on: 
  pull_request:
    types:  [opened]
permissions: 
  pull-requests: write
jobs:
  welcome:
    name: Post a welcome comment on PR
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR_URL" --body "Testing out PR on main!"
        env:
          GITHUB_TOKEN: ${{  secrets.GITHUB_TOKEN  }}
          PR_URL: ${{  github.event.pull_request.html_url  }}
